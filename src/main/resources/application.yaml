spring:
  application:
    name: hayi-shop-backend
  threads:
    virtual:
      enabled: true
  datasource:
    hikari:
      data-source-properties:
        connectionTimeZone: UTC              # JdbcClient reads/writes instants in UTC, like Hibernate (jdbc.time_zone)
        forceConnectionTimeZoneToSession: true
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        type:
          preferred_uuid_jdbc_type: BINARY   # UUID ↔ BINARY(16) (ERD README §2.2)
  flyway:
    locations: classpath:db/migration
  jackson:
    time-zone: UTC
  messages:
    fallback-to-system-locale: false   # messages.properties (vi-VN) is the fallback, never the JVM locale
  web:
    locale: vi_VN                      # default when Accept-Language is absent (API README §6)
  docker:
    compose:
      lifecycle-management: start-only

server:
  error:
    include-stacktrace: never
    include-message: never

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,modulith
  endpoint:
    health:
      probes:
        enabled: true
      group:
        liveness:
          include: livenessState               # optional dependencies never fail liveness (Observability §19.5)
        readiness:
          include: readinessState,db           # can we safely serve traffic?
          show-components: always              # component names + status only, never details

hayi:
  operational-timezone: Asia/Ho_Chi_Minh
  security:
    signing-key: ${HAYI_SECURITY_SIGNING_KEY:}   # ES256 private JWK (JSON); never committed
  identity:
    bootstrap:
      owner-email: ${HAYI_BOOTSTRAP_OWNER_EMAIL:}        # Decision K1: set both once on a new environment
      owner-password: ${HAYI_BOOTSTRAP_OWNER_PASSWORD:}  # temporary password, never logged

logging:
  structured:
    format:
      console: logstash   # JSON by default (Observability §19.2); MDC traceId becomes a top-level field
