spring:
  application:
    name: hayi-shop-backend
  threads:
    virtual:
      enabled: true
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        type:
          preferred_uuid_jdbc_type: BINARY   # UUID ↔ BINARY(16) (ERD README §2.2)
  flyway:
    locations: classpath:db/migration
  jackson:
    time-zone: UTC
  docker:
    compose:
      lifecycle-management: start-only

server:
  error:
    include-stacktrace: never
    include-message: never

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,modulith
  endpoint:
    health:
      probes:
        enabled: true

hayi:
  operational-timezone: Asia/Ho_Chi_Minh
