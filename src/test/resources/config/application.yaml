# Test-only overrides (classpath:/config/ wins over classpath:/application.yaml).
spring:
  profiles:
    active: test   # enables the dev OTP sender (Decision AN6)
hayi:
  rate-limit:
    auth:                       # same reason; AuthRateLimitTest sets its own limits (Decision AO4)
      login-per-minute: 1000000
      refresh-per-minute: 1000000
    public:                     # every MockMvc call comes from 127.0.0.1; PublicRateLimitTest sets its own limits
      get-per-minute: 1000000
      resolve-per-minute: 1000000
  security:
    allow-ephemeral-key: true   # tests never use a real signing key
    mfa-encryption-key: dGVzdC1vbmx5LW1mYS1rZXktMzItYnl0ZXMtbG9uZyE=   # test-only AES-256 key, never used elsewhere
