# Local development only. Credentials below are dev-only placeholders.
# Started automatically by spring-boot-docker-compose when running the app locally.
services:
  mysql:
    image: 'mysql:8.0'
    environment:
      - 'MYSQL_DATABASE=hayi_shop'
      - 'MYSQL_USER=hayi'
      - 'MYSQL_PASSWORD=hayi_dev'
      - 'MYSQL_ROOT_PASSWORD=hayi_root_dev'
      - 'TZ=UTC'
    command: ['--default-time-zone=+00:00', '--character-set-server=utf8mb4', '--collation-server=utf8mb4_0900_ai_ci']
    ports:
      - '3306'
  # S3-compatible object storage for local dev (MinIO images are no longer published).
  seaweedfs:
    image: 'chrislusf/seaweedfs:4.48'
    command: ['server', '-dir=/data', '-s3', '-s3.port=8333', '-s3.config=/etc/seaweedfs/s3.json']
    volumes:
      - './docker/seaweedfs/s3.json:/etc/seaweedfs/s3.json:ro'
    ports:
      - '8333'
    labels:
      org.springframework.boot.ignore: true
