openapi: 3.1.0
info:
  title: HaYi Shop Public API
  version: 1.0.0
  description: |
    Design-first spec (Decision G3). Endpoints are added per vertical slice from
    HaYi-Shop-Canonical-VI/docs/architecture/api/*.md before implementation.
servers:
  - url: /api/public/v1
tags:
  - name: PublicBranches
    description: ACTIVE Branches a customer can order from (API 02 §1, Decision N5, U)
  - name: FulfillmentAvailability
    description: Pickup slots a customer may choose (API 02 §3, Decision N, T)
paths:
  /branches:
    get:
      tags: [PublicBranches]
      operationId: listPublicBranches
      summary: ACTIVE Branches, by code
      description: |
        No sign-in. Only `ACTIVE` Branches (Decision U1). `openNow`/`todayHours` come from today's actual hours
        (`Asia/Ho_Chi_Minh`, override > weekly, U2); `earliestPickupAt` is the earliest bookable slot, `null` if none
        (N5, U4). `Cache-Control: public, max-age=300`.
      security: []
      responses:
        '200':
          description: The ACTIVE Branches.
          headers:
            Cache-Control: { $ref: '#/components/headers/FiveMinuteCache' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PublicBranchList' }
  /branches/{branchId}:
    get:
      tags: [PublicBranches]
      operationId: getPublicBranch
      summary: One ACTIVE Branch with its weekly hours and the next 7 days' overrides
      description: |
        No sign-in. Unknown or not `ACTIVE` → `404 BRANCH_NOT_FOUND` (Decision U1). Overrides of today … today + 6,
        without the internal `reason` (U3). `Cache-Control: public, max-age=300`.
      security: []
      parameters:
        - name: branchId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: The Branch.
          headers:
            Cache-Control: { $ref: '#/components/headers/FiveMinuteCache' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PublicBranchDetail' }
        '404':
          description: '`BRANCH_NOT_FOUND`'
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
  /branches/{branchId}/fulfillment/slots:
    get:
      tags: [FulfillmentAvailability]
      operationId: listPickupSlots
      security: []
      summary: Pickup slots of an ACTIVE Branch for the coming days
      description: |
        No sign-in. Slots are generated from the pickup windows and cut to the Branch's opening hours (Decision N4);
        each has a status but never a capacity number (T5). Unknown or not `ACTIVE` Branch → `404 BRANCH_NOT_FOUND`;
        `fromDate` in the past, `days < 1` or beyond `maxAdvanceDays` (today included) → `400` (T1). The answer is a
        hint only: capacity is claimed when the order is created. `Cache-Control: no-store`.
      parameters:
        - name: branchId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: fulfillmentType
          in: query
          required: false
          schema: { type: string, enum: [PICKUP], default: PICKUP }
        - name: fromDate
          in: query
          required: false
          description: Defaults to today (`Asia/Ho_Chi_Minh`).
          schema: { type: string, format: date }
        - name: days
          in: query
          required: false
          description: Defaults to `min(7, maxAdvanceDays)`; bounded by the horizon (Decision T1).
          schema: { type: integer, format: int32 }
        - name: orderType
          in: query
          required: false
          description: '`GROUP` uses the Group Order lead time (Decision N2).'
          schema: { type: string, enum: [INDIVIDUAL, GROUP], default: INDIVIDUAL }
        - name: itemCount
          in: query
          required: false
          description: Items the customer intends to order, checked against `maxItems` (T5).
          schema: { type: integer, format: int32, minimum: 1, maximum: 500 }
      responses:
        '200':
          description: The days asked for, each with its slots.
          headers:
            Cache-Control:
              description: Always `no-store`.
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PickupSlots' }
        '400':
          description: '`VALIDATION_FAILED`'
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '404':
          description: '`BRANCH_NOT_FOUND`'
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
components:
  headers:
    FiveMinuteCache:
      description: '`public, max-age=300` (API 02, Decision U1).'
      schema: { type: string }
  schemas:
    Problem:
      $ref: './components/common.yaml#/components/schemas/Problem'
    PublicFulfillmentType:
      type: string
      enum: [PICKUP]
    PublicAddress:
      type: object
      required: [line, ward, district, province]
      properties:
        line: { type: string }
        ward: { type: [string, 'null'] }
        district: { type: [string, 'null'] }
        province: { type: string }
    PublicGeoPoint:
      type: object
      required: [lat, lng]
      properties:
        lat: { type: number }
        lng: { type: number }
    OpeningRange:
      type: object
      required: [open, close]
      properties:
        open: { type: string, description: '`HH:mm`, Branch local time.' }
        close: { type: string, description: '`HH:mm`, Branch local time.' }
    WeeklyOpening:
      type: object
      required: [dayOfWeek, open, close]
      properties:
        dayOfWeek: { type: integer, description: '1 = Monday … 7 = Sunday (ISO-8601).' }
        open: { type: string }
        close: { type: string }
    PublicHourOverride:
      type: object
      required: [date, isClosed, intervals]
      properties:
        date: { type: string, format: date }
        isClosed: { type: boolean }
        intervals:
          type: array
          items: { $ref: '#/components/schemas/OpeningRange' }
    PublicBranch:
      type: object
      required: [branchId, branchCode, name, address, location, phone, timezone, openNow, todayHours, fulfillmentTypes,
        earliestPickupAt]
      properties:
        branchId: { type: string, format: uuid }
        branchCode: { type: string }
        name: { type: string }
        address: { $ref: '#/components/schemas/PublicAddress' }
        location:
          oneOf:
            - $ref: '#/components/schemas/PublicGeoPoint'
            - type: 'null'
        phone: { type: [string, 'null'] }
        timezone: { type: string, description: 'Always `Asia/Ho_Chi_Minh`.' }
        openNow: { type: boolean, description: '`ACTIVE` does not mean open now (Branch §4.3).' }
        todayHours:
          type: array
          items: { $ref: '#/components/schemas/OpeningRange' }
        fulfillmentTypes:
          type: array
          items: { $ref: '#/components/schemas/PublicFulfillmentType' }
        earliestPickupAt: { type: [string, 'null'], format: date-time, description: 'UTC; `null` if no bookable slot.' }
    PublicBranchList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/PublicBranch' }
    PublicBranchDetail:
      type: object
      description: A `PublicBranch` plus its hours.
      required: [branchId, branchCode, name, address, location, phone, timezone, openNow, todayHours, fulfillmentTypes,
        earliestPickupAt, weeklyHours, overrides]
      properties:
        branchId: { type: string, format: uuid }
        branchCode: { type: string }
        name: { type: string }
        address: { $ref: '#/components/schemas/PublicAddress' }
        location:
          oneOf:
            - $ref: '#/components/schemas/PublicGeoPoint'
            - type: 'null'
        phone: { type: [string, 'null'] }
        timezone: { type: string }
        openNow: { type: boolean }
        todayHours:
          type: array
          items: { $ref: '#/components/schemas/OpeningRange' }
        fulfillmentTypes:
          type: array
          items: { $ref: '#/components/schemas/PublicFulfillmentType' }
        earliestPickupAt: { type: [string, 'null'], format: date-time }
        weeklyHours:
          type: array
          description: Sorted by day, then opening time.
          items: { $ref: '#/components/schemas/WeeklyOpening' }
        overrides:
          type: array
          description: Today … today + 6, by date; no internal reason (Decision U3).
          items: { $ref: '#/components/schemas/PublicHourOverride' }
    SlotStatus:
      type: string
      enum: [AVAILABLE, NEARLY_FULL, FULL, CUTOFF_PASSED, CLOSED]
      description: '`CLOSED` is reserved; the MVP does not emit it (Decision T4).'
    Slot:
      type: object
      required: [slotStart, slotEnd, status]
      properties:
        slotStart: { type: string, description: '`HH:mm`, Branch local time.' }
        slotEnd: { type: string, description: '`HH:mm`, Branch local time.' }
        status: { $ref: '#/components/schemas/SlotStatus' }
    SlotDay:
      type: object
      required: [date, isOpen, slots]
      properties:
        date: { type: string, format: date }
        isOpen: { type: boolean, description: '`false` → no slots that day (Decision T3).' }
        slots:
          type: array
          items: { $ref: '#/components/schemas/Slot' }
    PickupSlots:
      type: object
      required: [branchId, fulfillmentType, timezone, asapAvailable, days]
      properties:
        branchId: { type: string, format: uuid }
        fulfillmentType: { type: string, enum: [PICKUP] }
        timezone: { type: string, description: 'Always `Asia/Ho_Chi_Minh`.' }
        asapAvailable: { type: boolean, description: 'Always `false` in the MVP.' }
        days:
          type: array
          items: { $ref: '#/components/schemas/SlotDay' }
