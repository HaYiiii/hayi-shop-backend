openapi: 3.1.0
info:
  title: HaYi Shop Customer API
  version: 1.0.0
  description: |
    Design-first spec (Decision G3). Endpoints are added per vertical slice from
    HaYi-Shop-Canonical-VI/docs/architecture/api/*.md before implementation.
    Authentication uses cookies only (API 01-security §3): `hy_c_at` (access JWT), `hy_c_rt` (refresh token).
servers:
  - url: /api/customer/v1
tags:
  - name: CustomerAuth
    description: Customer registration by phone OTP (API 01-security §6.1, Identity §2.11, Decision AN)
security:
  - accessCookie: []
paths:
  /auth/otp:
    post:
      tags: [CustomerAuth]
      operationId: requestOtp
      summary: Send a one-time code to a phone
      description: |
        No sign-in. Always `202`, whether or not the phone has an account (Decision AN1). The phone is Vietnamese
        (`0…`, `84…`, `+84…`), stored as E.164; anything else → `400` (AN2). A new code ends the open one for the same
        phone and purpose. 6 digits, valid 5 minutes. Limits: 1 per 60 s and 5 per hour per phone, 20 per hour per IP
        → `429 RATE_LIMITED` with `Retry-After` (AN5). Only `REGISTRATION` in this release.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/OtpRequest' }
      responses:
        '202':
          description: A code was sent if the request was valid.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OtpSent' }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /auth/otp/verify:
    post:
      tags: [CustomerAuth]
      operationId: verifyOtp
      summary: Answer a one-time code
      description: |
        No sign-in (Decision AN3). Right code → a `verificationToken` valid 10 minutes, usable once. Wrong code →
        `401 OTP_CODE_INVALID`; the 5th wrong code locks the challenge → `401 OTP_CHALLENGE_LOCKED`; unknown, expired,
        used or locked challenge → `401 OTP_CHALLENGE_INVALID`.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/OtpVerifyRequest' }
      responses:
        '200':
          description: The proof.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OtpVerified' }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /auth/register:
    post:
      tags: [CustomerAuth]
      operationId: registerCustomer
      summary: Create a Customer account with a verified phone
      description: |
        No sign-in and no session afterwards: the Customer logs in next (Decision AN4). A new phone needs `password`
        (8–128 characters, not a common one → else `422 AUTH_PASSWORD_POLICY_VIOLATION`). A phone that already has an
        account (a Staff member) needs `currentPassword` instead (missing → `422 AUTH_CURRENT_PASSWORD_REQUIRED`, wrong →
        `401 AUTH_INVALID_CREDENTIALS`, which also spends the proof); no second password is created. Already a
        Customer → `409 CUSTOMER_ALREADY_REGISTERED`. Invalid, expired, used or wrong-purpose token →
        `401 VERIFICATION_TOKEN_INVALID`. `referralCode` is accepted and ignored until Loyalty.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RegisterRequest' }
      responses:
        '201':
          description: Registered.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Registered' }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/BusinessRuleViolated' }
  /auth/login:
    post:
      tags: [CustomerAuth]
      operationId: loginCustomer
      summary: Log in with phone and password
      description: |
        On success sets `hy_c_at`, `hy_c_rt` and `hy_csrf` (Decision AO1). A malformed or unknown phone, a wrong
        password or an account without a Customer profile → `401 AUTH_INVALID_CREDENTIALS`; locked after 5 failures
        within a sliding 15 minutes → `429 AUTH_LOGIN_LOCKED` with `Retry-After` (K2). 20 attempts per minute per IP →
        `429 RATE_LIMITED` (AO4). `verificationRequired` is reserved for the risk engine (`202`), always `false` now.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CustomerLoginRequest' }
      responses:
        '200':
          description: Logged in.
          headers:
            Set-Cookie: { $ref: '#/components/headers/SetCookie' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CustomerLoginResponse' }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /auth/refresh:
    post:
      tags: [CustomerAuth]
      operationId: refreshCustomer
      summary: Rotate the refresh token
      description: |
        As the Backoffice (API 01-security §5, Decision AO3): 30 days idle, 180 days absolute, a 10 s grace for a
        just-rotated token, later reuse revokes the session (`401 AUTH_SESSION_REVOKED`). A refresh token of another
        surface's session → `401 AUTH_REQUIRED`. 30 per minute per session → `429 RATE_LIMITED` (AO4). Requires
        `X-CSRF-Token`.
      security:
        - refreshCookie: []
      parameters:
        - $ref: '#/components/parameters/RefreshTokenCookie'
        - $ref: '#/components/parameters/CsrfHeader'
      responses:
        '204':
          description: Tokens rotated.
          headers:
            Set-Cookie: { $ref: '#/components/headers/SetCookie' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /auth/logout:
    post:
      tags: [CustomerAuth]
      operationId: logoutCustomer
      summary: Revoke the current session
      description: Revokes the session and clears the Customer cookies. Idempotent. Requires `X-CSRF-Token`.
      security:
        - refreshCookie: []
      parameters:
        - $ref: '#/components/parameters/RefreshTokenCookie'
        - $ref: '#/components/parameters/CsrfHeader'
      responses:
        '204':
          description: Session revoked and cookies cleared.
          headers:
            Set-Cookie: { $ref: '#/components/headers/SetCookie' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /auth/csrf:
    get:
      tags: [CustomerAuth]
      operationId: issueCustomerCsrfToken
      summary: Re-issue the CSRF cookie
      description: Sets a fresh `hy_csrf` bound to the current session (API 01-security §3.1).
      responses:
        '204':
          description: CSRF cookie set.
          headers:
            Set-Cookie: { $ref: '#/components/headers/SetCookie' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /auth/me:
    get:
      tags: [CustomerAuth]
      operationId: getCustomerMe
      summary: The signed-in Customer
      description: '`{ userId, customerId, displayName, phoneMasked }`, every key present (Decision AO2).'
      responses:
        '200':
          description: The caller.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CustomerMe' }
        '401': { $ref: '#/components/responses/Unauthorized' }
components:
  securitySchemes:
    accessCookie:
      type: apiKey
      in: cookie
      name: hy_c_at
    refreshCookie:
      type: apiKey
      in: cookie
      name: hy_c_rt
  parameters:
    RefreshTokenCookie:
      name: hy_c_rt
      in: cookie
      required: false
      description: Opaque refresh token; missing or unknown → `401 AUTH_REQUIRED`.
      schema: { type: string, maxLength: 512 }
    CsrfHeader:
      name: X-CSRF-Token
      in: header
      required: false
      description: Value of the `hy_csrf` cookie; missing or wrong → `403 CSRF_INVALID`.
      schema: { type: string, maxLength: 512 }
  headers:
    SetCookie:
      description: Auth cookies (API 01-security §3).
      schema: { type: string }
  responses:
    ValidationFailed:
      description: '`VALIDATION_FAILED`'
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    Unauthorized:
      description: "`AUTH_REQUIRED`, `AUTH_TOKEN_EXPIRED`, `AUTH_SESSION_REVOKED`, `AUTH_INVALID_CREDENTIALS`, `OTP_CODE_INVALID`, `OTP_CHALLENGE_LOCKED`, `OTP_CHALLENGE_INVALID` or `VERIFICATION_TOKEN_INVALID`"
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    Forbidden:
      description: '`CSRF_INVALID`'
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    Conflict:
      description: '`CUSTOMER_ALREADY_REGISTERED`'
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    BusinessRuleViolated:
      description: "`AUTH_PASSWORD_POLICY_VIOLATION` or `AUTH_CURRENT_PASSWORD_REQUIRED`"
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    RateLimited:
      description: '`RATE_LIMITED` (Decision AN5, AO4) or `AUTH_LOGIN_LOCKED` (K2)'
      headers:
        Retry-After:
          description: Seconds until the request may be retried.
          schema: { type: integer }
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
  schemas:
    Problem:
      $ref: './components/common.yaml#/components/schemas/Problem'
    OtpPurpose:
      type: string
      enum: [REGISTRATION]
    OtpRequest:
      type: object
      required: [phone, purpose]
      properties:
        phone: { type: string, minLength: 1, maxLength: 20, description: 'Vietnamese phone, e.g. `0901234567`.' }
        purpose: { $ref: '#/components/schemas/OtpPurpose' }
    OtpSent:
      type: object
      required: [challengeId, expiresAt, resendAfterSeconds]
      properties:
        challengeId: { type: string, format: uuid }
        expiresAt: { type: string, format: date-time }
        resendAfterSeconds: { type: integer, format: int64 }
    OtpVerifyRequest:
      type: object
      required: [challengeId, code]
      properties:
        challengeId: { type: string, format: uuid }
        code: { type: string, pattern: '^\d{6}$' }
    OtpVerified:
      type: object
      required: [verificationToken, expiresAt]
      properties:
        verificationToken: { type: string }
        expiresAt: { type: string, format: date-time }
    RegisterRequest:
      type: object
      required: [verificationToken, displayName]
      properties:
        verificationToken: { type: string, minLength: 1, maxLength: 2048 }
        displayName: { type: string, minLength: 1, maxLength: 128, pattern: '[\s\S]*\S[\s\S]*', description: Not blank. }
        password: { type: [string, 'null'], maxLength: 1024, description: For a new phone. }
        currentPassword: { type: [string, 'null'], maxLength: 1024, description: For a phone that already has an account. }
        referralCode: { type: [string, 'null'], maxLength: 32, description: Accepted and ignored until Loyalty. }
    Registered:
      type: object
      required: [customerId]
      properties:
        customerId: { type: string, format: uuid }
    CustomerLoginRequest:
      type: object
      required: [phone, password]
      properties:
        phone: { type: string, minLength: 1, maxLength: 20 }
        password: { type: string, minLength: 1, maxLength: 1024 }
    CustomerLoginResponse:
      type: object
      required: [verificationRequired, challengeId]
      properties:
        verificationRequired: { type: boolean }
        challengeId: { type: [string, 'null'], format: uuid }
    CustomerMe:
      type: object
      required: [userId, customerId, displayName, phoneMasked]
      properties:
        userId: { type: string, format: uuid }
        customerId: { type: [string, 'null'], format: uuid }
        displayName: { type: [string, 'null'] }
        phoneMasked: { type: [string, 'null'], description: 'e.g. `+8490*****567`' }
