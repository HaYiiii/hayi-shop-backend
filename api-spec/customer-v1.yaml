openapi: 3.1.0
info:
  title: HaYi Shop Customer API
  version: 1.0.0
  description: |
    Design-first spec (Decision G3). Endpoints are added per vertical slice from
    HaYi-Shop-Canonical-VI/docs/architecture/api/*.md before implementation.
    Authentication uses cookies only (API 01-security §3): `hy_c_at` (access JWT), `hy_c_rt` (refresh token).
servers:
  - url: /api/customer/v1
tags:
  - name: CustomerAuth
    description: Customer registration by phone OTP (API 01-security §6.1, Identity §2.11, Decision AN)
  - name: CustomerProfile
    description: The signed-in Customer's own profile (API 07 §1, Customer §3.2)
  - name: Cart
    description: The signed-in Customer's server Cart per Branch (API 03 §1, Cart & Pricing §6, Decision AV)
security:
  - accessCookie: []
paths:
  /auth/otp:
    post:
      tags: [CustomerAuth]
      operationId: requestOtp
      summary: Send a one-time code to a phone
      description: |
        No sign-in. Always `202`, whether or not the phone has an account (Decision AN1). The phone is Vietnamese
        (`0…`, `84…`, `+84…`), stored as E.164; anything else → `400` (AN2). A new code ends the open one for the same
        phone and purpose. 6 digits, valid 5 minutes. Limits: 1 per 60 s and 5 per hour per phone, 20 per hour per IP
        → `429 RATE_LIMITED` with `Retry-After` (AN5). `PASSWORD_RECOVERY` sends a code only to a phone that is already
        a Customer; any other phone gets the same answer and no SMS (Decision AS1).
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/OtpRequest' }
      responses:
        '202':
          description: A code was sent if the request was valid.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OtpSent' }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /auth/otp/verify:
    post:
      tags: [CustomerAuth]
      operationId: verifyOtp
      summary: Answer a one-time code
      description: |
        No sign-in (Decision AN3). Right code → a `verificationToken` valid 10 minutes, usable once. Wrong code →
        `401 OTP_CODE_INVALID`; the 5th wrong code locks the challenge → `401 OTP_CHALLENGE_LOCKED`; unknown, expired,
        used or locked challenge → `401 OTP_CHALLENGE_INVALID`.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/OtpVerifyRequest' }
      responses:
        '200':
          description: The proof.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OtpVerified' }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /auth/register:
    post:
      tags: [CustomerAuth]
      operationId: registerCustomer
      summary: Create a Customer account with a verified phone
      description: |
        No sign-in and no session afterwards: the Customer logs in next (Decision AN4). A new phone needs `password`
        (8–128 characters, not a common one → else `422 AUTH_PASSWORD_POLICY_VIOLATION`). A phone that already has an
        account (a Staff member) needs `currentPassword` instead (missing → `422 AUTH_CURRENT_PASSWORD_REQUIRED`, wrong →
        `401 AUTH_INVALID_CREDENTIALS`, which also spends the proof); no second password is created. Already a
        Customer → `409 CUSTOMER_ALREADY_REGISTERED`. Invalid, expired, used or wrong-purpose token →
        `401 VERIFICATION_TOKEN_INVALID`. `referralCode` is accepted and ignored until Loyalty.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RegisterRequest' }
      responses:
        '201':
          description: Registered.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Registered' }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/BusinessRuleViolated' }
  /auth/login:
    post:
      tags: [CustomerAuth]
      operationId: loginCustomer
      summary: Log in with phone and password
      description: |
        On success sets `hy_c_at`, `hy_c_rt` and `hy_c_csrf` (Decision AO1). A malformed or unknown phone, a wrong
        password or an account without a Customer profile → `401 AUTH_INVALID_CREDENTIALS`; locked after 5 failures
        within a sliding 15 minutes → `429 AUTH_LOGIN_LOCKED` with `Retry-After` (K2). 20 attempts per minute per IP →
        `429 RATE_LIMITED` (AO4). `verificationRequired` is reserved for the risk engine (`202`), always `false` now.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CustomerLoginRequest' }
      responses:
        '200':
          description: Logged in.
          headers:
            Set-Cookie: { $ref: '#/components/headers/SetCookie' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CustomerLoginResponse' }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /auth/refresh:
    post:
      tags: [CustomerAuth]
      operationId: refreshCustomer
      summary: Rotate the refresh token
      description: |
        As the Backoffice (API 01-security §5, Decision AO3): 30 days idle, 180 days absolute, a 10 s grace for a
        just-rotated token, later reuse revokes the session (`401 AUTH_SESSION_REVOKED`). A refresh token of another
        surface's session → `401 AUTH_REQUIRED`. 30 per minute per session → `429 RATE_LIMITED` (AO4). Requires
        `X-CSRF-Token`.
      security:
        - refreshCookie: []
      parameters:
        - $ref: '#/components/parameters/RefreshTokenCookie'
        - $ref: '#/components/parameters/CsrfHeader'
      responses:
        '204':
          description: Tokens rotated.
          headers:
            Set-Cookie: { $ref: '#/components/headers/SetCookie' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /auth/logout:
    post:
      tags: [CustomerAuth]
      operationId: logoutCustomer
      summary: Revoke the current session
      description: Revokes the session and clears the Customer cookies. Idempotent. Requires `X-CSRF-Token`.
      security:
        - refreshCookie: []
      parameters:
        - $ref: '#/components/parameters/RefreshTokenCookie'
        - $ref: '#/components/parameters/CsrfHeader'
      responses:
        '204':
          description: Session revoked and cookies cleared.
          headers:
            Set-Cookie: { $ref: '#/components/headers/SetCookie' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /auth/csrf:
    get:
      tags: [CustomerAuth]
      operationId: issueCustomerCsrfToken
      summary: Re-issue the CSRF cookie
      description: Sets a fresh `hy_c_csrf` bound to the current session (API 01-security §3.1).
      responses:
        '204':
          description: CSRF cookie set.
          headers:
            Set-Cookie: { $ref: '#/components/headers/SetCookie' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /auth/me:
    get:
      tags: [CustomerAuth]
      operationId: getCustomerMe
      summary: The signed-in Customer
      description: '`{ userId, customerId, displayName, phoneMasked }`, every key present (Decision AO2).'
      responses:
        '200':
          description: The caller.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CustomerMe' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /auth/password/reset:
    post:
      tags: [CustomerAuth]
      operationId: resetPassword
      summary: Set a new password with a recovery proof
      description: |
        No sign-in (Decision AS2). `verificationToken` must be an unused `PASSWORD_RECOVERY` proof → else
        `401 VERIFICATION_TOKEN_INVALID`. The password follows the User's policy (AS4) → `422
        AUTH_PASSWORD_POLICY_VIOLATION`. Every session of the User ends, Customer and Staff, because the password is
        shared; the login lock is cleared. No session is opened: the Customer logs in next.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PasswordResetRequest' }
      responses:
        '204':
          description: Password reset.
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422': { $ref: '#/components/responses/BusinessRuleViolated' }
  /auth/password/change:
    post:
      tags: [CustomerAuth]
      operationId: changePassword
      summary: Change the signed-in Customer's password
      description: |
        Decision AS3. Wrong `currentPassword` → `401 AUTH_INVALID_CREDENTIALS`, counted toward the login lock (locked →
        `429 AUTH_LOGIN_LOCKED`); the same password or a policy failure (AS4) → `422`. Every other session of the User
        ends, Customer and Staff; this one stays. Requires `X-CSRF-Token`.
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PasswordChangeRequest' }
      responses:
        '204':
          description: Password changed.
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/BusinessRuleViolated' }
        '429': { $ref: '#/components/responses/LoginLocked' }
  /auth/sessions:
    get:
      tags: [CustomerAuth]
      operationId: listCustomerSessions
      summary: The devices signed in on this surface
      description: |
        The caller's own live sessions of this surface's persona, most recently used first; `current` marks this one
        (Decision AT1).
      responses:
        '200':
          description: The sessions.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DeviceSessionList' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /auth/sessions/{sessionId}:
    parameters:
      - name: sessionId
        in: path
        required: true
        schema: { type: string, format: uuid }
    delete:
      tags: [CustomerAuth]
      operationId: revokeCustomerSession
      summary: Sign out another device
      description: |
        Ends another of the caller's sessions now; its next request gets `401` (Decision AT2). Another user's or
        persona's session, an unknown or ended one → `404 SESSION_NOT_FOUND`; this session → `409 SESSION_IS_CURRENT`
        (use `/auth/logout`). Requires `X-CSRF-Token`.
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
      responses:
        '204':
          description: Session revoked.
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/SessionNotFound' }
        '409': { $ref: '#/components/responses/SessionIsCurrent' }
  /me/profile:
    get:
      tags: [CustomerProfile]
      operationId: getMyProfile
      summary: The signed-in Customer's profile
      description: |
        `phoneMasked` comes from the login phone (Identity §2.2); `loyalty` is `null` until Loyalty (S16) but the key is
        always there (API 07 §1). `ETag` is the profile version, for `If-Match` on `PATCH`.
      responses:
        '200':
          description: The profile.
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CustomerProfile' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    patch:
      tags: [CustomerProfile]
      operationId: updateMyProfile
      summary: Rename the signed-in Customer
      description: |
        JSON Merge Patch on `displayName` (1–128, not blank, not `null`); any other key → `400`. Requires `If-Match`
        (missing → `428`, stale → `412`); the same name keeps the version (Decision O). Requires `X-CSRF-Token`.
      parameters:
        - name: If-Match
          in: header
          required: false
          schema: { type: string, maxLength: 64 }
        - $ref: '#/components/parameters/CsrfHeader'
      requestBody:
        required: true
        content:
          application/merge-patch+json:
            schema: { $ref: '#/components/schemas/CustomerProfilePatch' }
      responses:
        '200':
          description: The profile after the edit.
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CustomerProfile' }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '412': { $ref: '#/components/responses/VersionConflict' }
        '428': { $ref: '#/components/responses/PreconditionRequired' }
  /branches/{branchId}/cart:
    parameters:
      - $ref: '#/components/parameters/BranchIdPath'
    get:
      tags: [Cart]
      operationId: getCart
      summary: The caller's Cart at a Branch
      description: |
        The caller's `ACTIVE` Cart at the Branch; none yet → an empty Cart (`cartId: null`, `version: 0`,
        `updatedAt: null`) and nothing is created (Decision AV1). Every item is resolved again through the Catalog
        resolver at `at` (the planned pickup time, default now): current `unitPrice` / `lineTotal` (`null` when the
        Product or size is unknown), names from the Catalog (`null` when gone), and each resolver issue as `BLOCKING`.
        An item that went out after it was added stays, flagged (Decision F). Writes nothing. Branch unknown or not
        `ACTIVE` → `404 BRANCH_NOT_FOUND`.
      parameters:
        - $ref: '#/components/parameters/AtQuery'
      responses:
        '200':
          description: The Cart.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Cart' }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/BranchNotFound' }
    delete:
      tags: [Cart]
      operationId: clearCart
      summary: Remove every item from the caller's Cart at a Branch
      description: |
        Removes every item; the Cart stays `ACTIVE` and keeps its coupon. No Cart yet → the empty Cart, nothing is
        created (Decision AW3). `If-Match: "v{version}"` of the Cart is optional: stale → `412 VERSION_CONFLICT`,
        nothing changes (AW2). Requires `X-CSRF-Token`.
      parameters:
        - $ref: '#/components/parameters/IfMatchOptional'
        - $ref: '#/components/parameters/CsrfHeader'
      responses:
        '200':
          description: The Cart after it was cleared.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Cart' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/BranchNotFound' }
        '412': { $ref: '#/components/responses/VersionConflict' }
  /branches/{branchId}/cart/items/{cartItemId}:
    parameters:
      - $ref: '#/components/parameters/BranchIdPath'
      - name: cartItemId
        in: path
        required: true
        schema: { type: string, format: uuid }
    patch:
      tags: [Cart]
      operationId: updateCartItem
      summary: Change an item of the caller's Cart
      description: |
        JSON Merge Patch on `quantity` (1..99), `variantId`, `optionItemIds` (≤ 20, replaced as a whole) and `note`
        (`null` or blank removes it, at most 255 characters once normalized); a missing key keeps the value; `at` is
        the planned pickup time the item is resolved at (default now); any other key → `400`. The item after the edit
        is resolved again: any issue → `422 CART_ITEM_INVALID` with `issues[]` and the item is unchanged. When it
        becomes equivalent to another item, the two merge: the other item gets the quantity (a total above 99 →
        `422 CART_ITEM_QUANTITY_LIMIT`, nothing changes) and the edited one is removed; `cartItemId` names the item
        that remains (Decision AW1). An item that is not in the caller's Cart → `404 CART_ITEM_NOT_FOUND` (AW3).
        `If-Match: "v{version}"` of the Cart is optional: stale → `412 VERSION_CONFLICT` (AW2). Requires
        `X-CSRF-Token`.
      parameters:
        - $ref: '#/components/parameters/IfMatchOptional'
        - $ref: '#/components/parameters/CsrfHeader'
      requestBody:
        required: true
        content:
          application/merge-patch+json:
            schema: { $ref: '#/components/schemas/CartItemPatch' }
      responses:
        '200':
          description: The Cart after the edit, with the item that remains.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CartItemEdit' }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/CartItemNotFound' }
        '412': { $ref: '#/components/responses/VersionConflict' }
        '422': { $ref: '#/components/responses/CartItemRejected' }
    delete:
      tags: [Cart]
      operationId: removeCartItem
      summary: Remove an item from the caller's Cart
      description: |
        An item that is not in the caller's Cart → `404 CART_ITEM_NOT_FOUND` (Decision AW3). `If-Match: "v{version}"`
        of the Cart is optional: stale → `412 VERSION_CONFLICT` (AW2). Requires `X-CSRF-Token`.
      parameters:
        - $ref: '#/components/parameters/IfMatchOptional'
        - $ref: '#/components/parameters/CsrfHeader'
      responses:
        '200':
          description: The Cart without the item.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Cart' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/CartItemNotFound' }
        '412': { $ref: '#/components/responses/VersionConflict' }
  /branches/{branchId}/cart/items:
    parameters:
      - $ref: '#/components/parameters/BranchIdPath'
    post:
      tags: [Cart]
      operationId: addCartItem
      summary: Add an item to the caller's Cart at a Branch
      description: |
        Resolves the item at `at` (default now). Any issue → `422 CART_ITEM_INVALID` with `issues[]`, nothing added.
        Otherwise the `ACTIVE` Cart is created on first use; an equivalent item (same product, size, options and
        normalized note) gets the quantity added, else a new item is added. `note` is stripped with inner whitespace
        collapsed, blank → `null`, at most 255 characters. A total above 99 for one item → `422 CART_ITEM_QUANTITY_LIMIT`;
        a new item when the Cart already holds 50 → `422 CART_ITEM_LIMIT` (Decision AV2). The resolved price is kept as
        the price last seen. Requires `X-CSRF-Token`.
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AddCartItemRequest' }
      responses:
        '200':
          description: The Cart after the item was added.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Cart' }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/BranchNotFound' }
        '422': { $ref: '#/components/responses/CartItemRejected' }
  /carts:
    get:
      tags: [Cart]
      operationId: listCarts
      summary: The caller's ACTIVE Carts at every Branch
      description: |
        For the cart badge: `itemCount` is the sum of quantities; most recently updated first; no prices (Decision AV3).
      responses:
        '200':
          description: The Carts.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CartSummaryList' }
        '401': { $ref: '#/components/responses/Unauthorized' }
components:
  securitySchemes:
    accessCookie:
      type: apiKey
      in: cookie
      name: hy_c_at
    refreshCookie:
      type: apiKey
      in: cookie
      name: hy_c_rt
  parameters:
    RefreshTokenCookie:
      name: hy_c_rt
      in: cookie
      required: false
      description: Opaque refresh token; missing or unknown → `401 AUTH_REQUIRED`.
      schema: { type: string, maxLength: 512 }
    CsrfHeader:
      name: X-CSRF-Token
      in: header
      required: false
      description: Value of the `hy_c_csrf` cookie (the Customer one, Decision AP1); missing or wrong → `403 CSRF_INVALID`.
      schema: { type: string, maxLength: 512 }
    BranchIdPath:
      name: branchId
      in: path
      required: true
      schema: { type: string, format: uuid }
    AtQuery:
      name: at
      in: query
      required: false
      description: The planned pickup time (ISO instant, default now), for the selling hours; malformed → `400`.
      schema: { type: string, format: date-time }
    IfMatchOptional:
      name: If-Match
      in: header
      required: false
      description: '`"v{version}"` the change is based on (API README §8); stale → `412 VERSION_CONFLICT`.'
      schema: { type: string, maxLength: 64 }
  headers:
    ETag:
      description: '`"v{version}"` of the resource (API README §8).'
      schema: { type: string }
    SetCookie:
      description: Auth cookies (API 01-security §3).
      schema: { type: string }
  responses:
    BranchNotFound:
      description: '`BRANCH_NOT_FOUND` (Decision W6)'
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    CartItemRejected:
      description: |
        `CART_ITEM_INVALID` with `issues[]` (the resolver's), `CART_ITEM_QUANTITY_LIMIT` or `CART_ITEM_LIMIT`
        (Decision AV2)
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/CartItemProblem' }
    CartItemNotFound:
      description: '`CART_ITEM_NOT_FOUND` (Decision AW3) or `BRANCH_NOT_FOUND` (Decision W6)'
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    SessionNotFound:
      description: '`SESSION_NOT_FOUND` (Decision AT2)'
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    SessionIsCurrent:
      description: '`SESSION_IS_CURRENT` (Decision AT2)'
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    LoginLocked:
      description: '`AUTH_LOGIN_LOCKED` (K2)'
      headers:
        Retry-After:
          description: Seconds until the account unlocks.
          schema: { type: integer }
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    ValidationFailed:
      description: '`VALIDATION_FAILED`'
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    Unauthorized:
      description: "`AUTH_REQUIRED`, `AUTH_TOKEN_EXPIRED`, `AUTH_SESSION_REVOKED`, `AUTH_INVALID_CREDENTIALS`, `OTP_CODE_INVALID`, `OTP_CHALLENGE_LOCKED`, `OTP_CHALLENGE_INVALID` or `VERIFICATION_TOKEN_INVALID`"
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    Forbidden:
      description: '`CSRF_INVALID`'
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    VersionConflict:
      description: '`VERSION_CONFLICT`'
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    PreconditionRequired:
      description: '`PRECONDITION_REQUIRED`'
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    Conflict:
      description: '`CUSTOMER_ALREADY_REGISTERED`'
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    BusinessRuleViolated:
      description: "`AUTH_PASSWORD_POLICY_VIOLATION` or `AUTH_CURRENT_PASSWORD_REQUIRED`"
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    RateLimited:
      description: '`RATE_LIMITED` (Decision AN5, AO4) or `AUTH_LOGIN_LOCKED` (K2)'
      headers:
        Retry-After:
          description: Seconds until the request may be retried.
          schema: { type: integer }
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
  schemas:
    Problem:
      $ref: './components/common.yaml#/components/schemas/Problem'
    OtpPurpose:
      type: string
      enum: [REGISTRATION, PASSWORD_RECOVERY]
    OtpRequest:
      type: object
      required: [phone, purpose]
      properties:
        phone: { type: string, minLength: 1, maxLength: 20, description: 'Vietnamese phone, e.g. `0901234567`.' }
        purpose: { $ref: '#/components/schemas/OtpPurpose' }
    OtpSent:
      type: object
      required: [challengeId, expiresAt, resendAfterSeconds]
      properties:
        challengeId: { type: string, format: uuid }
        expiresAt: { type: string, format: date-time }
        resendAfterSeconds: { type: integer, format: int64 }
    OtpVerifyRequest:
      type: object
      required: [challengeId, code]
      properties:
        challengeId: { type: string, format: uuid }
        code: { type: string, pattern: '^\d{6}$' }
    OtpVerified:
      type: object
      required: [verificationToken, expiresAt]
      properties:
        verificationToken: { type: string }
        expiresAt: { type: string, format: date-time }
    RegisterRequest:
      type: object
      required: [verificationToken, displayName]
      properties:
        verificationToken: { type: string, minLength: 1, maxLength: 2048 }
        displayName: { type: string, minLength: 1, maxLength: 128, pattern: '[\s\S]*\S[\s\S]*', description: Not blank. }
        password: { type: [string, 'null'], maxLength: 1024, description: For a new phone. }
        currentPassword: { type: [string, 'null'], maxLength: 1024, description: For a phone that already has an account. }
        referralCode: { type: [string, 'null'], maxLength: 32, description: Accepted and ignored until Loyalty. }
    Registered:
      type: object
      required: [customerId]
      properties:
        customerId: { type: string, format: uuid }
    CustomerLoginRequest:
      type: object
      required: [phone, password]
      properties:
        phone: { type: string, minLength: 1, maxLength: 20 }
        password: { type: string, minLength: 1, maxLength: 1024 }
    CustomerLoginResponse:
      type: object
      required: [verificationRequired, challengeId]
      properties:
        verificationRequired: { type: boolean }
        challengeId: { type: [string, 'null'], format: uuid }
    CustomerMe:
      type: object
      required: [userId, customerId, displayName, phoneMasked]
      properties:
        userId: { type: string, format: uuid }
        customerId: { type: [string, 'null'], format: uuid }
        displayName: { type: [string, 'null'] }
        phoneMasked: { type: [string, 'null'], description: 'e.g. `+8490*****567`' }
    Loyalty:
      type: object
      required: [tier, availablePoints]
      properties:
        tier: { type: string }
        availablePoints: { type: integer, format: int64 }
    CustomerProfile:
      type: object
      required: [customerId, displayName, phoneMasked, loyalty]
      properties:
        customerId: { type: string, format: uuid }
        displayName: { type: string }
        phoneMasked: { type: [string, 'null'] }
        loyalty:
          description: '`null` until Loyalty (S16).'
          oneOf:
            - $ref: '#/components/schemas/Loyalty'
            - type: 'null'
    CustomerProfilePatch:
      type: object
      additionalProperties: false
      description: JSON Merge Patch of the profile; `displayName` cannot be `null` or blank.
      properties:
        displayName: { type: string, maxLength: 128 }
    PasswordResetRequest:
      type: object
      required: [verificationToken, newPassword]
      properties:
        verificationToken: { type: string, minLength: 1, maxLength: 2048 }
        newPassword: { type: string, minLength: 1, maxLength: 1024 }
    PasswordChangeRequest:
      type: object
      required: [currentPassword, newPassword]
      properties:
        currentPassword: { type: string, minLength: 1, maxLength: 1024 }
        newPassword: { type: string, minLength: 1, maxLength: 1024 }
    DeviceSession:
      type: object
      required: [sessionId, userAgent, ipAddress, createdAt, lastActiveAt, current]
      properties:
        sessionId: { type: string, format: uuid }
        userAgent: { type: [string, 'null'] }
        ipAddress: { type: [string, 'null'] }
        createdAt: { type: string, format: date-time }
        lastActiveAt: { type: string, format: date-time }
        current: { type: boolean }
    DeviceSessionList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/DeviceSession' }
    MoneyVnd:
      $ref: './components/common.yaml#/components/schemas/MoneyVnd'
    CartIssueCode:
      type: string
      enum: [PRODUCT_NOT_FOUND, PRODUCT_SOLD_OUT, PRODUCT_PAUSED, OUTSIDE_SELLING_HOURS, VARIANT_SOLD_OUT,
        VARIANT_NOT_AVAILABLE, OPTION_ITEM_SOLD_OUT, OPTION_SELECTION_INVALID, REQUIRED_OPTION_GROUP_UNSATISFIABLE]
      description: The Catalog resolver's issues (Catalog §5.8, Decision AJ2, AK4).
    CartIssueSeverity:
      type: string
      enum: [BLOCKING]
    CartIssue:
      type: object
      required: [code, severity]
      properties:
        code: { $ref: '#/components/schemas/CartIssueCode' }
        severity: { $ref: '#/components/schemas/CartIssueSeverity' }
        optionItemId: { type: [string, 'null'], format: uuid }
        optionGroupId: { type: [string, 'null'], format: uuid }
    CartItemOption:
      type: object
      required: [optionItemId, optionGroupName, optionItemName, extraPrice]
      properties:
        optionItemId: { type: string, format: uuid }
        optionGroupName: { type: [string, 'null'], description: '`null` when no longer on offer.' }
        optionItemName: { type: [string, 'null'] }
        extraPrice: { type: [integer, 'null'], format: int64 }
    CartItem:
      type: object
      required: [cartItemId, productId, productName, variantId, variantName, options, note, quantity, unitPrice,
        lineTotal, issues]
      properties:
        cartItemId: { type: string, format: uuid }
        productId: { type: string, format: uuid }
        productName: { type: [string, 'null'] }
        variantId: { type: string, format: uuid }
        variantName: { type: [string, 'null'] }
        options:
          type: array
          items: { $ref: '#/components/schemas/CartItemOption' }
        note: { type: [string, 'null'] }
        quantity: { type: integer }
        unitPrice: { type: [integer, 'null'], format: int64, description: Provisional; `null` when unknown. }
        lineTotal: { type: [integer, 'null'], format: int64 }
        issues:
          type: array
          items: { $ref: '#/components/schemas/CartIssue' }
    Cart:
      type: object
      required: [cartId, branchId, version, items, couponCode, provisionalSubtotal, hasBlockingIssues, updatedAt]
      properties:
        cartId: { type: [string, 'null'], format: uuid, description: '`null` while the Customer has no Cart here.' }
        branchId: { type: string, format: uuid }
        version: { type: integer, format: int64 }
        items:
          type: array
          items: { $ref: '#/components/schemas/CartItem' }
        couponCode: { type: [string, 'null'] }
        provisionalSubtotal: { $ref: '#/components/schemas/MoneyVnd' }
        hasBlockingIssues: { type: boolean }
        updatedAt: { type: [string, 'null'], format: date-time }
    AddCartItemRequest:
      type: object
      required: [productId, variantId, quantity]
      properties:
        productId: { type: string, format: uuid }
        variantId: { type: string, format: uuid }
        optionItemIds:
          type: array
          maxItems: 20
          items: { type: string, format: uuid }
        quantity: { type: integer, minimum: 1, maximum: 99 }
        note: { type: [string, 'null'], maxLength: 1024, description: 'At most 255 characters once normalized.' }
        at: { type: [string, 'null'], format: date-time, description: The planned pickup time (default now). }
    CartItemPatch:
      type: object
      additionalProperties: false
      description: |
        JSON Merge Patch of a Cart item: a missing key keeps the value; `note: null` removes the note; `quantity`,
        `variantId` and `optionItemIds` cannot be `null`. `at` is not stored: the item is resolved at it.
      properties:
        quantity: { type: integer, minimum: 1, maximum: 99 }
        variantId: { type: string, format: uuid }
        optionItemIds:
          type: array
          maxItems: 20
          items: { type: string, format: uuid }
        note: { type: [string, 'null'], maxLength: 1024, description: 'At most 255 characters once normalized.' }
        at: { type: [string, 'null'], format: date-time, description: The planned pickup time (default now). }
    CartItemEdit:
      type: object
      required: [cart, cartItemId, merged]
      properties:
        cart: { $ref: '#/components/schemas/Cart' }
        cartItemId: { type: string, format: uuid, description: The item that remains after the edit. }
        merged: { type: boolean, description: The edited item was merged into another one and is gone. }
    CartItemProblem:
      allOf:
        - $ref: '#/components/schemas/Problem'
        - type: object
          properties:
            issues:
              type: array
              items: { $ref: '#/components/schemas/CartIssue' }
    CartSummary:
      type: object
      required: [cartId, branchId, itemCount, updatedAt]
      properties:
        cartId: { type: string, format: uuid }
        branchId: { type: string, format: uuid }
        itemCount: { type: integer }
        updatedAt: { type: string, format: date-time }
    CartSummaryList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/CartSummary' }
