openapi: 3.1.0
info:
  title: HaYi Shop Backoffice API
  version: 1.0.0
  description: |
    Design-first spec (Decision G3). Endpoints are added per vertical slice from
    HaYi-Shop-Canonical-VI/docs/architecture/api/*.md before implementation.

    Authentication uses cookies only (API 01-security §3): `hy_b_at` (access JWT), `hy_b_rt` (refresh token)
    and `hy_csrf` (double-submit token, sent back as `X-CSRF-Token` on every unsafe request with a session).

    Authorization (Decision M): every endpoint outside `/auth` needs a permission of API 01-security §7, checked in
    this order: missing permission → `403 PERMISSION_DENIED`; `{branchId}` outside the caller's scope →
    `403 BRANCH_SCOPE_DENIED`; action **S** without a fresh step-up → `403 STEP_UP_REQUIRED`. An entity of another
    Branch than the path → `404` (API README §3.1).
servers:
  - url: /api/backoffice/v1
tags:
  - name: Auth
    description: Backoffice login, MFA, step-up, session, CSRF and the caller's access (API 01-security §5–6, §8, Decision K, L, M)
security:
  - accessCookie: []
paths:
  /auth/login:
    post:
      tags: [Auth]
      operationId: login
      summary: Log in with email and password
      description: |
        On success sets `hy_b_at`, `hy_b_rt` and `hy_csrf` and every flag of the response is false.
        Otherwise exactly one step comes first, and no cookie is set:
        a temporary password → `passwordChangeRequired` + `changeToken` (Decision K3); an active MFA factor →
        `mfaRequired` + `mfaChallengeId` (`POST /auth/mfa/verify`); a STORE role without MFA →
        `mfaEnrollmentRequired` + `enrollmentToken` (`POST /auth/mfa/enroll`, Decision D4, L6).
        Wrong identifier or password, or an account without Backoffice access →
        `401 AUTH_INVALID_CREDENTIALS`; locked after 5 failures within a sliding 15 minutes →
        `429 AUTH_LOGIN_LOCKED` with `Retry-After` (Decision K2).
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoginRequest' }
      responses:
        '200':
          description: Logged in, or a password change is required first.
          headers:
            Set-Cookie: { $ref: '#/components/headers/SetCookie' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LoginResponse' }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
  /auth/password/first-change:
    post:
      tags: [Auth]
      operationId: changeFirstPassword
      summary: Replace the temporary password
      description: |
        Uses the `changeToken` from login (TTL 5 minutes). Returns `204` without a session; the user logs in again
        with the new password (Decision K3). Password policy: 12–128 characters, different from the current one,
        not a common password → otherwise `422 AUTH_PASSWORD_POLICY_VIOLATION` (Decision K4).
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/FirstPasswordChangeRequest' }
      responses:
        '204':
          description: Password changed.
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422': { $ref: '#/components/responses/BusinessRuleViolated' }
  /auth/mfa/verify:
    post:
      tags: [Auth]
      operationId: verifyMfa
      summary: Complete login with a TOTP or recovery code
      description: |
        Answers the challenge from login (TTL 5 minutes) with a 6-digit TOTP code or an unused recovery code, then
        sets the session cookies. Wrong code → `401 MFA_CODE_INVALID`; the 5th wrong code locks the challenge →
        `401 MFA_CHALLENGE_LOCKED` and the user logs in again. Unknown, expired, used or replaced challenge (a new
        login replaces the user's open one) → `401 AUTH_REQUIRED`. The 10th wrong code of the user within a sliding
        15 minutes, across challenges, locks the login for 15 minutes → `429 AUTH_LOGIN_LOCKED` (Decision L1). MFA
        failures do not count towards the password failures.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MfaVerifyRequest' }
      responses:
        '204':
          description: Logged in.
          headers:
            Set-Cookie: { $ref: '#/components/headers/SetCookie' }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
  /auth/mfa/enroll:
    post:
      tags: [Auth]
      operationId: startMfaEnrollment
      summary: Start TOTP enrollment
      description: |
        Uses the `enrollmentToken` from login (TTL 10 minutes, Decision L2) and returns a new TOTP secret as an
        `otpauth://` URI (the UI draws the QR code) and as base32 for manual entry (Decision L4). Calling it again
        replaces the pending secret. Invalid token or MFA already enabled → `401 AUTH_REQUIRED`.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MfaEnrollmentRequest' }
      responses:
        '200':
          description: Pending TOTP secret.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MfaEnrollmentResponse' }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /auth/mfa/enroll/confirm:
    post:
      tags: [Auth]
      operationId: confirmMfaEnrollment
      summary: Confirm TOTP enrollment with a first code
      description: |
        Activates the pending factor when the code matches, returns 10 single-use recovery codes — shown this one
        time only — and sets the session cookies (Decision L5). Wrong code → `401 MFA_CODE_INVALID`; invalid token
        or nothing pending → `401 AUTH_REQUIRED`.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MfaEnrollmentConfirmRequest' }
      responses:
        '200':
          description: MFA enabled and logged in.
          headers:
            Set-Cookie: { $ref: '#/components/headers/SetCookie' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MfaEnrollmentConfirmResponse' }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /auth/step-up:
    post:
      tags: [Auth]
      operationId: stepUp
      summary: Re-authenticate the current session for sensitive actions
      description: |
        With MFA: `code` (TOTP); without MFA: `password`. Sets the session's `stepUpVerifiedAt`, so actions marked
        **S** are allowed for 5 minutes (API 01-security §8, Decision L7); they answer `403 STEP_UP_REQUIRED`
        otherwise. Wrong code → `401 MFA_CODE_INVALID`, wrong password → `401 AUTH_INVALID_CREDENTIALS`; the 5th
        failure within 15 minutes revokes the session → `401 AUTH_SESSION_REVOKED`. Requires `X-CSRF-Token`.
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/StepUpRequest' }
      responses:
        '204':
          description: Session re-authenticated.
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /auth/refresh:
    post:
      tags: [Auth]
      operationId: refresh
      summary: Rotate the refresh token
      description: |
        Issues a new access token and refresh token and marks the old refresh token rotated. Reusing a rotated
        token within 10 seconds returns the pair already issued; later reuse revokes the whole session
        (`401 AUTH_SESSION_REVOKED`, API 01-security §5). Requires `X-CSRF-Token`.
      security:
        - refreshCookie: []
      parameters:
        - $ref: '#/components/parameters/RefreshTokenCookie'
        - $ref: '#/components/parameters/CsrfHeader'
      responses:
        '204':
          description: Tokens rotated.
          headers:
            Set-Cookie: { $ref: '#/components/headers/SetCookie' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /auth/logout:
    post:
      tags: [Auth]
      operationId: logout
      summary: Revoke the current session
      description: Revokes the session and clears the auth cookies. Idempotent. Requires `X-CSRF-Token`.
      security:
        - refreshCookie: []
      parameters:
        - $ref: '#/components/parameters/RefreshTokenCookie'
        - $ref: '#/components/parameters/CsrfHeader'
      responses:
        '204':
          description: Session revoked and cookies cleared.
          headers:
            Set-Cookie: { $ref: '#/components/headers/SetCookie' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /auth/csrf:
    get:
      tags: [Auth]
      operationId: issueCsrfToken
      summary: Re-issue the CSRF cookie
      description: Sets a fresh `hy_csrf` bound to the current session (API 01-security §3.1).
      responses:
        '204':
          description: CSRF cookie set.
          headers:
            Set-Cookie: { $ref: '#/components/headers/SetCookie' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /auth/me:
    get:
      tags: [Auth]
      operationId: getMe
      summary: Current user's roles and permissions
      description: |
        For the UI permission guard only; the server checks every endpoint itself (API 01-security §6.2, Decision M4).
        `storePermissions` apply at every Branch (STORE roles: Owner/Admin). `branches` lists the Branches where a
        BRANCH role is in effect, i.e. backed by an active staff assignment (Decision A); their `permissions` already
        include `storePermissions`. Resolved live, so a role change shows on the next call.
      responses:
        '200':
          description: The caller's effective access.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BackofficeMe' }
        '401': { $ref: '#/components/responses/Unauthorized' }
components:
  securitySchemes:
    accessCookie:
      type: apiKey
      in: cookie
      name: hy_b_at
    refreshCookie:
      type: apiKey
      in: cookie
      name: hy_b_rt
  parameters:
    RefreshTokenCookie:
      name: hy_b_rt
      in: cookie
      required: false
      description: Opaque refresh token; missing or unknown → `401 AUTH_REQUIRED`.
      schema: { type: string, maxLength: 512 }
    CsrfHeader:
      name: X-CSRF-Token
      in: header
      required: false
      description: Value of the `hy_csrf` cookie; missing or wrong → `403 CSRF_INVALID`.
      schema: { type: string, maxLength: 512 }
  headers:
    SetCookie:
      description: Auth cookies (API 01-security §3).
      schema: { type: string }
  schemas:
    Problem:
      $ref: './components/common.yaml#/components/schemas/Problem'
    LoginRequest:
      type: object
      required: [identifier, password]
      properties:
        identifier:
          type: string
          minLength: 1
          maxLength: 255
          description: Email (Owner/Admin). Employee code and phone arrive with staff provisioning.
        password:
          type: string
          minLength: 1
          maxLength: 1024
    LoginResponse:
      type: object
      description: Says which step must come first; every flag is false once logged in.
      required: [passwordChangeRequired, changeToken, mfaRequired, mfaChallengeId, mfaEnrollmentRequired, enrollmentToken]
      properties:
        passwordChangeRequired:
          type: boolean
        changeToken:
          type: [string, 'null']
          description: |
            Single-purpose token for `POST /auth/password/first-change`, valid 5 minutes; `null` when no
            change is required.
        mfaRequired:
          type: boolean
        mfaChallengeId:
          type: [string, 'null']
          format: uuid
          description: Challenge for `POST /auth/mfa/verify`, valid 5 minutes; `null` unless `mfaRequired`.
        mfaEnrollmentRequired:
          type: boolean
        enrollmentToken:
          type: [string, 'null']
          description: |
            Single-purpose token for `POST /auth/mfa/enroll` and `/auth/mfa/enroll/confirm`, valid 10 minutes;
            `null` unless `mfaEnrollmentRequired`.
    MfaVerifyRequest:
      type: object
      required: [mfaChallengeId, code]
      properties:
        mfaChallengeId:
          type: string
          format: uuid
        code:
          type: string
          minLength: 1
          maxLength: 32
          description: 6-digit TOTP code or a recovery code (`XXXXX-XXXXX`, case and dash ignored).
    MfaEnrollmentRequest:
      type: object
      required: [enrollmentToken]
      properties:
        enrollmentToken:
          type: string
          minLength: 1
          maxLength: 2048
    MfaEnrollmentResponse:
      type: object
      required: [otpauthUri, secret]
      properties:
        otpauthUri:
          type: string
          description: '`otpauth://totp/...` for the authenticator app; the UI renders it as a QR code.'
        secret:
          type: string
          description: The same TOTP secret in base32, for manual entry.
    MfaEnrollmentConfirmRequest:
      type: object
      required: [enrollmentToken, code]
      properties:
        enrollmentToken:
          type: string
          minLength: 1
          maxLength: 2048
        code:
          type: string
          minLength: 1
          maxLength: 32
    MfaEnrollmentConfirmResponse:
      type: object
      required: [recoveryCodes]
      properties:
        recoveryCodes:
          type: array
          description: 10 single-use recovery codes, returned this one time only.
          items:
            type: string
    StepUpRequest:
      type: object
      description: '`code` when the user has MFA, `password` otherwise.'
      properties:
        code:
          type: [string, 'null']
          maxLength: 32
        password:
          type: [string, 'null']
          maxLength: 1024
    BackofficeMe:
      type: object
      required: [userId, storeRoles, storePermissions, branches]
      properties:
        userId:
          type: string
          format: uuid
        storeRoles:
          type: array
          description: Role codes held at STORE scope, e.g. `OWNER`, `ADMIN`.
          items: { type: string }
        storePermissions:
          type: array
          description: Permission codes (API 01-security §7) granted by the STORE roles, at every Branch.
          items: { type: string }
        branches:
          type: array
          items: { $ref: '#/components/schemas/BranchAccess' }
    BranchAccess:
      type: object
      required: [branchId, roles, permissions]
      properties:
        branchId:
          type: string
          format: uuid
        roles:
          type: array
          description: BRANCH role codes in effect at this Branch, e.g. `MANAGER`, `BARISTA`.
          items: { type: string }
        permissions:
          type: array
          description: Every permission at this Branch, `storePermissions` included.
          items: { type: string }
    FirstPasswordChangeRequest:
      type: object
      required: [changeToken, newPassword]
      properties:
        changeToken:
          type: string
          minLength: 1
          maxLength: 2048
        newPassword:
          type: string
          minLength: 1
          maxLength: 1024
  responses:
    ValidationFailed:
      description: '`VALIDATION_FAILED`'
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    Unauthorized:
      description: |
        `AUTH_REQUIRED`, `AUTH_TOKEN_EXPIRED`, `AUTH_SESSION_REVOKED`, `AUTH_INVALID_CREDENTIALS`, `MFA_CODE_INVALID`,
        `MFA_CHALLENGE_LOCKED`
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    Forbidden:
      description: '`CSRF_INVALID`, `PERMISSION_DENIED`, `BRANCH_SCOPE_DENIED`, `STEP_UP_REQUIRED`'
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    BusinessRuleViolated:
      description: '`AUTH_PASSWORD_POLICY_VIOLATION`'
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    TooManyRequests:
      description: '`AUTH_LOGIN_LOCKED`'
      headers:
        Retry-After:
          description: Seconds until the account unlocks.
          schema: { type: integer }
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
